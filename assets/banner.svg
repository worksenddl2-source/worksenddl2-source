<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1026"/>
      <stop offset="0.55" stop-color="#1B2550"/>
      <stop offset="1" stop-color="#2E1F4F"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/>
    </pattern>
    <linearGradient id="lamp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD43B" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFD43B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cam" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FD1FF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4FD1FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE38A"/>
      <stop offset="1" stop-color="#FFD43B" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="420" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#sky)"/>
    <rect width="1200" height="420" fill="url(#grid)"/>

    <!-- stars -->
    <g fill="#FFFFFF">
      <circle cx="640" cy="40" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="80" r="1.1"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="1010" cy="34" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="110" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="3.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- skyline -->
    <g fill="#10173A">
      <rect x="640" y="190" width="70" height="140"/>
      <rect x="715" y="150" width="55" height="180"/>
      <rect x="1060" y="130" width="90" height="200"/>
      <rect x="1150" y="200" width="60" height="130"/>
    </g>
    <g fill="#FFD43B">
      <rect x="655" y="210" width="8" height="10"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="6s" repeatCount="indefinite"/></rect>
      <rect x="685" y="240" width="8" height="10" opacity="0.6"/>
      <rect x="730" y="175" width="8" height="10" opacity="0.7"/>
      <rect x="750" y="230" width="8" height="10"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="5s" repeatCount="indefinite"/></rect>
      <rect x="1085" y="250" width="8" height="10" opacity="0.6"/>
      <rect x="1115" y="280" width="8" height="10"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="7s" repeatCount="indefinite"/></rect>
    </g>

    <!-- ground -->
    <rect x="0" y="330" width="1200" height="90" fill="#0A0F26" fill-opacity="0.6"/>
    <line x1="0" y1="330" x2="1200" y2="330" stroke="#3776AB" stroke-opacity="0.5"/>

    <!-- streetlight -->
    <g>
      <polygon points="905,186 840,330 975,330" fill="url(#lamp)">
        <animate attributeName="opacity" values="0.55;0.95;0.55" dur="4s" repeatCount="indefinite"/>
      </polygon>
      <rect x="868" y="178" width="5" height="152" fill="#2A3366"/>
      <path d="M870 180 Q872 170 890 172 L905 176" stroke="#2A3366" stroke-width="5" fill="none"/>
      <circle cx="905" cy="184" r="26" fill="url(#glow)" opacity="0.7"/>
      <rect x="895" y="176" width="20" height="8" rx="3" fill="#FFE38A"/>
    </g>

    <!-- CCTV with sweeping view cone -->
    <g transform="translate(1062 150)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-12;14;-12" dur="8s" repeatCount="indefinite"/>
        <polygon points="0,0 -250,165 -130,185" fill="url(#cam)"/>
        <rect x="-26" y="-8" width="30" height="14" rx="3" fill="#C9D1D9"/>
        <circle cx="-26" cy="-1" r="4" fill="#4FD1FF"/>
      </g>
      <rect x="0" y="-12" width="6" height="22" fill="#5A6390"/>
      <circle cx="-12" cy="-14" r="2.5" fill="#FF4D6D">
        <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- pedestrian with AI detection box -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;230 0;0 0" dur="14s" repeatCount="indefinite"/>
      <g fill="#C9D1D9" transform="translate(770 0)">
        <circle cx="0" cy="282" r="8"/>
        <path d="M-7 292 h14 l3 22 h-5 l-2 16 h-6 l-2 -16 h-5 z"/>
      </g>
      <g transform="translate(770 0)">
        <rect x="-20" y="266" width="40" height="68" fill="none" stroke="#FF4D6D" stroke-width="2" stroke-dasharray="6 4">
          <animate attributeName="stroke-dashoffset" values="0;20" dur="1s" repeatCount="indefinite"/>
        </rect>
        <rect x="-20" y="250" width="84" height="16" fill="#FF4D6D"/>
        <text x="-16" y="262" font-family="Consolas, Menlo, monospace" font-size="11" fill="#FFFFFF">person 0.97</text>
      </g>
    </g>

    <!-- text -->
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
      <text x="60" y="92" font-size="18" font-weight="600" letter-spacing="4" fill="#4FD1FF" opacity="0">
        HELLO, WORLD — I'M
        <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.8s" fill="freeze"/>
      </text>
      <text x="56" y="168" font-size="76" font-weight="800" fill="#FFFFFF" opacity="0">
        worksenddl2
        <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.8s" fill="freeze"/>
      </text>
      <text x="60" y="214" font-size="30" font-weight="700" fill="#E6EDF3" opacity="0">
        Physical AI × CPTED Developer
        <animate attributeName="opacity" from="0" to="1" begin="1s" dur="0.8s" fill="freeze"/>
      </text>
      <text x="60" y="250" font-size="20" font-weight="600" fill="#FFD43B" opacity="0">
        → AI that prevents crime before it happens
        <animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.8s" fill="freeze"/>
      </text>
    </g>

    <!-- tags -->
    <g font-family="Consolas, Menlo, monospace" font-size="14" fill="#E6EDF3" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.8s" fill="freeze"/>
      <rect x="60" y="272" width="80" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.15"/>
      <text x="76" y="291">Python</text>
      <rect x="150" y="272" width="64" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.15"/>
      <text x="166" y="291">YOLO</text>
      <rect x="224" y="272" width="104" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.15"/>
      <text x="240" y="291">MediaPipe</text>
      <rect x="338" y="272" width="88" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.15"/>
      <text x="354" y="291">Arduino</text>
      <rect x="436" y="272" width="72" height="28" rx="14" fill="#FFD43B" fill-opacity="0.15" stroke="#FFD43B" stroke-opacity="0.5"/>
      <text x="452" y="291" fill="#FFD43B">CPTED</text>
    </g>

    <!-- pipeline timeline: SEE → DETECT → LIGHT UP → PREVENT -->
    <g>
      <rect x="40" y="356" width="1120" height="44" rx="12" fill="#070B1E" fill-opacity="0.75" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <line x1="70" y1="378" x2="1130" y2="378" stroke="#FFFFFF" stroke-opacity="0.12" stroke-dasharray="2 10"/>
      <g font-family="Consolas, Menlo, monospace" font-size="12" fill="#8B95B8">
        <rect x="174" y="372" width="12" height="12" transform="rotate(45 180 378)" fill="#FFD43B"/>
        <text x="196" y="383">01 SEE</text>
        <rect x="434" y="372" width="12" height="12" transform="rotate(45 440 378)" fill="#FFD43B"/>
        <text x="456" y="383">02 DETECT</text>
        <rect x="694" y="372" width="12" height="12" transform="rotate(45 700 378)" fill="#FFD43B"/>
        <text x="716" y="383">03 LIGHT UP</text>
        <rect x="954" y="372" width="12" height="12" transform="rotate(45 960 378)" fill="#FFD43B"/>
        <text x="976" y="383">04 PREVENT</text>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;1060 0" dur="8s" repeatCount="indefinite"/>
        <line x1="70" y1="362" x2="70" y2="394" stroke="#FF4D6D" stroke-width="2.5"/>
        <polygon points="64,360 76,360 70,368" fill="#FF4D6D"/>
      </g>
    </g>
  </g>
</svg>
