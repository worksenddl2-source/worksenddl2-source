<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270" font-family="'Segoe UI','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1026"/><stop offset="0.6" stop-color="#1B2550"/><stop offset="1" stop-color="#2E1F4F"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#fff" stroke-opacity="0.05"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4FD1FF" stop-opacity="0.35"/><stop offset="1" stop-color="#4FD1FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1026" stop-opacity="0"/><stop offset="1" stop-color="#0B1026" stop-opacity="0.85"/>
    </linearGradient>
    <clipPath id="frame"><rect width="480" height="270" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="480" height="270" fill="url(#bg)"/>
    <rect width="480" height="270" fill="url(#grid)"/>
    <circle cx="340" cy="95" r="150" fill="url(#glow)"/>
    <g><g fill="none" stroke="#4FD1FF" stroke-width="3" stroke-linejoin="round"><path d="M240 60 H300"/><path d="M300 60 l6 -10 l12 20 l12 -20 l12 20 l12 -20 l6 10"/><path d="M360 60 H430 V100"/><path d="M430 145 V160 H240 V125"/><path d="M240 95 V60"/></g><line x1="225" y1="105" x2="255" y2="105" stroke="#fff" stroke-width="4"/><line x1="232" y1="115" x2="248" y2="115" stroke="#fff" stroke-width="4"/><text x="215" y="100" font-size="13" fill="#FFD43B">+</text><polygon points="418,100 442,100 430,122" fill="#FFD43B"/><line x1="416" y1="124" x2="444" y2="124" stroke="#FFD43B" stroke-width="3"/><line x1="430" y1="124" x2="430" y2="145" stroke="#4FD1FF" stroke-width="3"/><g stroke="#FFD43B" stroke-width="2"><line x1="450" y1="100" x2="462" y2="92"/><line x1="452" y1="112" x2="466" y2="108"/></g><text x="330" y="40" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">V = I × R</text><circle cx="300" cy="160" r="5" fill="#FFD43B"><animate attributeName="cx" values="240;430;430" dur="3s" repeatCount="indefinite"/></circle></g>
    <rect y="150" width="480" height="120" fill="url(#fade)"/>
    <rect x="20" y="18" width="43" height="22" rx="11" fill="#4FD1FF" fill-opacity="0.18" stroke="#4FD1FF" stroke-opacity="0.6"/><text x="41" y="33" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4FD1FF">PPTX</text><rect x="68.8" y="18" width="50" height="22" rx="11" fill="#4FD1FF" fill-opacity="0.18" stroke="#4FD1FF" stroke-opacity="0.6"/><text x="94" y="33" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4FD1FF">manim</text>
    <text x="22" y="214" font-size="27" font-weight="800" fill="#FFFFFF">Electronics Basics</text>
    <text x="22" y="241" font-size="14" fill="#C9D1E9">비전공자를 위한 전자전기 기초 강의자료</text>
    <rect y="265" width="480" height="5" fill="#4FD1FF"/>
